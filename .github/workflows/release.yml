name: Release

# Pushing a vX.Y tag builds, notarizes, and publishes that tag. Running the workflow by hand builds and
# notarizes the chosen branch without publishing anything; give it an existing tag to publish that tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v1.7. Leave empty to build the branch without publishing.'
        required: false
        type: string

# One run per tag or branch at a time, so a second run cannot overwrite a release the first is making.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      # AppRelease checks everything it can before building, including ReleaseNotes/<tag>.md when it
      # publishes, and signs with a temporary keychain that it removes when it exits.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_RELEASE_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          APP_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_RELEASE_NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          APP_RELEASE_NOTARY_KEY_IDENTIFIER: ${{ secrets.NOTARY_API_KEY_ID }}
          APP_RELEASE_NOTARY_ISSUER_IDENTIFIER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          engine_version=$(sed -nE 's/^release_engine_version=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Release.zsh)
          git clone --quiet --depth 1 --branch "$engine_version" https://github.com/Mx-Iris/AppRelease "$RUNNER_TEMP/AppRelease"
          if [ -n "$RELEASE_TAG" ]; then
            "$RUNNER_TEMP/AppRelease/app-release" all --version-tag "$RELEASE_TAG" --publish
          else
            "$RUNNER_TEMP/AppRelease/app-release" all
          fi

      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: StarLight-${{ env.RELEASE_TAG || github.sha }}
          path: build/AppRelease/StarLight/[0-9]*/Products/
          if-no-files-found: error
          retention-days: 14

      # The terminal only shows a summary of a failed xcodebuild; the full logs are in the run directory.
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StarLight-logs-${{ github.run_id }}
          path: build/AppRelease/StarLight/[0-9]*/logs/
          if-no-files-found: ignore
          retention-days: 14
